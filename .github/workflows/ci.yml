name: ai-workspace

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.11']
        exclude:
          - os: ubuntu-latest
            python-version: '3.8'
        include:
          - os: ubuntu-22.04
            python-version: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Workspace health
        run: python ai.py doctor --strict
      - name: Verification contract
        run: python ai.py check --strict --allow-empty
      - name: Workspace self-tests
        run: python lib/tests/run.py

  lint:
    # ruff and mypy are development tools and need Python 3.9+; the runtime matrix
    # above keeps proving the CLI still runs on 3.8.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types (mypy)
        run: python -m mypy
      - name: CLI contract (capabilities == argparse)
        run: python -m unittest test_capabilities -q
        working-directory: lib/tests
