name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The same code, built and tested on every supported OS.
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      # The workspace is its own project here: init is a no-op, doctor reads
      # the real task/spec/config tree, capabilities derives the clap contract.
      - name: Smoke (init, doctor, capabilities, version)
        shell: bash
        env:
          AI_WORKSPACE: ${{ github.workspace }}
        run: |
          cargo run --quiet --locked -- init
          cargo run --quiet --locked -- doctor
          cargo run --quiet --locked -- capabilities --json > /dev/null
          cargo run --quiet --locked -- version

      - name: Launcher (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ai
          ./ai version

      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: ai.cmd version

  # Formatting and lints are OS-independent; one runner is enough.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

  # `rust-version` in Cargo.toml must stay honest: an old toolchain has to
  # compile the exact dependency set in Cargo.lock.
  msrv:
    name: MSRV (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check
        run: cargo check --locked --all-targets

  # Downloadable binaries, published only after the matrix is green.
  release:
    name: release / ${{ matrix.os }}
    needs: [test, lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build release
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/ai.exe ]; then
            cp target/release/ai.exe dist/
            cp ai.cmd dist/
          else
            cp target/release/ai dist/
            cp ai dist/ai-launcher.sh
            chmod +x dist/ai dist/ai-launcher.sh
          fi
          cp README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ai-${{ runner.os }}
          path: dist/
          if-no-files-found: error
