[package]
name = "ai"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
description = "Local, cross-platform CLI for the .ai engineering workspace (Rust port)"
license = "MIT"
readme = "README.md"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
